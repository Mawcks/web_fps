<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Web FPS — Carve</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<main class="app">
  <header>
    <h1>Web FPS <span class="sub">carve a world, then play it</span></h1>
  </header>

  <div class="toolbar">
    <button id="modeBtn" class="primary">Enter Play (P)</button>
    <span class="divider"></span>
    <button id="toolBtn">Tool: Carve</button>
    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear</button>
    <span class="divider"></span>
    <button id="saveBtn">Save</button>
    <button id="loadBtn">Load</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <label class="check"><input id="gridToggle" type="checkbox" checked /> Grid</label>
    <span class="divider"></span>
    <button id="settingsBtn">Settings</button>
  </div>

  <div id="canvas-container">
    <div id="crosshair"></div>
    <div id="scorePanel"></div>
    <div id="lockOverlay">
      <div class="lock-card">
        <strong>Click to play</strong>
        <span>WASD move &middot; mouse look &middot; click shoot &middot; Esc release &middot; P to edit</span>
      </div>
    </div>
  </div>

  <p id="hud" class="hud"></p>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
